capture_note:
  name: Add capture note
  description: >-
    Write a timestamped note into the raw bus capture, e.g. before each step
    of a thermostat registration. Bus capture must be on in the options.
  fields:
    text:
      name: Text
      description: Note to record.
      required: true
      example: "Pressed OK on controller, registration mode on channel 3"
      selector:
        text:

measure_latency:
  name: Measure bus latency
  description: >-
    Experimental. Sends the controller's poll to a thermostat while the bus is
    idle and times its reply through the gateway, to see how fast Home
    Assistant can answer on the bus. Transmits on the heating bus.
  fields:
    device_id:
      name: Device ID
      description: Thermostat bus address (4 hex digits, from the entity ID).
      required: true
      example: "42A5"
      selector:
        text:
    count:
      name: Count
      description: Number of polls, one per 10 s poll cycle.
      default: 20
      selector:
        number:
          min: 1
          max: 50

register_virtual_thermostat:
  name: Register virtual thermostat
  description: >-
    Experimental. Answer the controller's registration broadcast as a virtual
    thermostat. Arm the channel on the controller (hold OK, pick the channel,
    press OK) while the window is open.
  fields:
    device_id:
      name: Device ID
      description: Virtual thermostat to register. Needed when there are several.
      example: "42F0"
      selector:
        text:
    seconds:
      name: Window
      description: How long to wait for the registration broadcast.
      default: 60
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s

start_virtual_thermostat:
  name: Start virtual thermostat
  description: Experimental. Resume answering the controller's polls.
  fields:
    device_id:
      name: Device ID
      description: Virtual thermostat to start. All when left empty.
      example: "42F0"
      selector:
        text:

stop_virtual_thermostat:
  name: Stop virtual thermostat
  description: >-
    Experimental. Stop answering the controller's polls, as if the thermostat
    had failed. The controller then runs its fallback on that channel.
  fields:
    device_id:
      name: Device ID
      description: Virtual thermostat to stop. All when left empty.
      example: "42F0"
      selector:
        text:
